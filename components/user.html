<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - FixMyArea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/user.js" defer></script>
    <script src="../js/main.js" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 font-sans min-h-screen transition-colors duration-300">
    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50 transition-colors duration-300">
        <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between gap-4 whitespace-nowrap">
                <div class="flex min-w-0 items-center gap-2">
                    <a href="../index.html" class="flex shrink-0 items-center gap-2">
                        <i class="fa-solid fa-map-location-dot text-2xl text-teal-500"></i>
                        <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">FixMyArea</span>
                    </a>
                    <span class="hidden text-xs text-slate-500 dark:text-slate-400 md:inline">Make your area better.</span>
                </div>

                <div class="hidden flex-1 items-center justify-center md:flex md:gap-6 lg:gap-8">
                    <a href="../index.html" class="nav-link rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:text-teal-600 dark:text-slate-300 dark:hover:text-white">Home</a>
                    <a href="issues.html" class="nav-link rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:text-teal-600 dark:text-slate-300 dark:hover:text-white">Browse Issues</a>
                    <a href="report.html" class="nav-link rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:text-teal-600 dark:text-slate-300 dark:hover:text-white">Report Issue</a>
                    <a href="about.html" class="nav-link rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:text-teal-600 dark:text-slate-300 dark:hover:text-white">About</a>
                </div>

                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="rounded-md p-2 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white" aria-label="Toggle Dark Mode">
                        <i id="theme-toggle-icon" class="fa-solid fa-sun text-lg"></i>
                    </button>
                    <div id="auth-control" class="flex items-center">
                        <a id="login-button" href="login.html" class="hidden inline-flex h-10 items-center justify-center rounded-md bg-teal-500 px-4 text-sm font-medium text-white shadow-sm transition-colors hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500">Login</a>
                    </div>
                </div>

                <div class="flex items-center gap-2 md:hidden">
                    <button id="mobile-theme-toggle-inline" class="rounded-md p-2 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white" aria-label="Toggle Dark Mode">
                        <i id="mobile-theme-toggle-icon-inline" class="fa-solid fa-sun text-lg"></i>
                    </button>
                    <button type="button" id="mobile-menu-btn" class="inline-flex items-center justify-center rounded-md p-2 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-teal-500 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white" aria-controls="mobile-menu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <i class="fa-solid fa-bars text-xl" id="menu-icon"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="hidden border-t border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800 md:hidden" id="mobile-menu">
            <div class="space-y-1 px-2 pb-3 pt-2 sm:px-3">
                <a href="../index.html" class="nav-link block rounded-md px-3 py-2 text-base font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white">Home</a>
                <a href="issues.html" class="nav-link block rounded-md px-3 py-2 text-base font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white">Browse Issues</a>
                <a href="report.html" class="nav-link block rounded-md px-3 py-2 text-base font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white">Report Issue</a>
                <a href="about.html" class="nav-link block rounded-md px-3 py-2 text-base font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white">About</a>
                <div id="mobile-auth-control" class="pt-2">
                    <a id="mobile-login-button" href="login.html" class="hidden block rounded-md bg-teal-500 px-3 py-2 text-center text-base font-medium text-white transition-colors hover:bg-teal-600">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-12">
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl overflow-hidden">
            <div class="bg-gradient-to-r from-teal-500 to-cyan-500 p-8 text-white">
                <div class="flex items-center gap-5">
                    <div id="user-avatar" class="w-20 h-20 rounded-full bg-white/20 border-2 border-white/60 flex items-center justify-center text-2xl font-bold shadow-lg">
                        U
                    </div>
                    <div>
                        <p class="text-sm uppercase tracking-[0.2em] text-teal-100">Member profile</p>
                        <h1 id="user-name" class="text-3xl font-bold mt-2">User</h1>
                    </div>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-8 p-8">
                <div class="space-y-4">
                    <div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 p-5">
                        <p class="text-xs uppercase tracking-[0.25em] text-slate-500 dark:text-slate-400">Email</p>
                        <p id="user-email" class="mt-3 text-lg font-semibold text-slate-900 dark:text-white">user@example.com</p>
                    </div>
                    <div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 p-5">
                        <p class="text-xs uppercase tracking-[0.25em] text-slate-500 dark:text-slate-400">Role</p>
                        <p class="mt-3 text-lg font-semibold text-slate-900 dark:text-white">User</p>
                    </div>
                </div>

                <div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 p-5">
                    <p class="text-xs uppercase tracking-[0.25em] text-slate-500 dark:text-slate-400">Quick actions</p>
                    <div class="mt-5 space-y-3">
                        <a href="../index.html" class="block w-full bg-teal-500 hover:bg-teal-600 text-white font-semibold py-3 px-4 rounded-lg text-center transition-colors">
                            <i class="fa-solid fa-house mr-2"></i> Go to Home
                        </a>
                        <a href="issues.html" class="block w-full bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-900 dark:text-slate-100 font-semibold py-3 px-4 rounded-lg text-center transition-colors">
                            <i class="fa-solid fa-list-check mr-2"></i> Browse Issues
                        </a>
                        <a href="report.html" class="block w-full bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-900 dark:text-slate-100 font-semibold py-3 px-4 rounded-lg text-center transition-colors">
                            <i class="fa-solid fa-flag mr-2"></i> Report Issue
                        </a>
                        <button id="logout-button" type="button" class="block w-full bg-slate-800 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-lg text-center transition-colors">
                            <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
