<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FixMyArea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/main.js" defer></script>
    <script src="../js/admin.js" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 font-sans min-h-screen transition-colors duration-300">
    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50 transition-colors duration-300">
        <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between gap-4 whitespace-nowrap">
                <div class="flex min-w-0 items-center gap-2">
                    <a href="../index.html" class="flex shrink-0 items-center gap-2">
                        <i class="fa-solid fa-map-location-dot text-2xl text-teal-500"></i>
                        <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">FixMyArea</span>
                    </a>
                    <span class="hidden text-xs text-slate-500 dark:text-slate-400 md:inline">Admin dashboard</span>
                </div>

                <div class="hidden flex-1 items-center justify-center md:flex md:gap-6 lg:gap-8"></div>

                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="rounded-md p-2 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white" aria-label="Toggle Dark Mode">
                        <i id="theme-toggle-icon" class="fa-solid fa-sun text-lg"></i>
                    </button>
                    <div id="auth-control" class="flex items-center">
                        <a id="login-button" href="login.html" class="hidden inline-flex h-10 items-center justify-center rounded-md bg-teal-500 px-4 text-sm font-medium text-white shadow-sm transition-colors hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-7xl px-4 py-10">
        <div class="mb-8 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <p class="text-sm uppercase tracking-[0.2em] text-teal-600 dark:text-teal-400">Dashboard</p>
                    <h1 class="mt-2 text-3xl font-bold text-slate-900 dark:text-white">Municipal Admin Overview</h1>
                </div>
                <div class="flex gap-3">
                    <a href="report.html" class="inline-flex items-center justify-center rounded-lg bg-teal-500 px-4 py-2 font-semibold text-white hover:bg-teal-600">New Report</a>
                    <button id="admin-logout-button" type="button" class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2 font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600">Logout</button>
                </div>
            </div>
        </div>

        <section class="mb-8 grid gap-4 md:grid-cols-4">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">Total Reports</p>
                <p id="total-reports" class="mt-3 text-3xl font-bold text-slate-900 dark:text-white">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">In Progress</p>
                <p id="in-progress-reports" class="mt-3 text-3xl font-bold text-amber-500">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">Resolved</p>
                <p id="resolved-reports" class="mt-3 text-3xl font-bold text-emerald-500">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">Registered Users</p>
                <p id="total-users" class="mt-3 text-3xl font-bold text-sky-500">0</p>
            </div>
        </section>

        <section class="grid gap-8 lg:grid-cols-[1.5fr_1fr]">
            <div class="space-y-8">
                <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                    <div class="mb-4 flex items-center justify-between">
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Recent reports</h2>
                        <span class="text-sm text-slate-500 dark:text-slate-400">Mock data</span>
                    </div>
                    <div id="admin-reports-list" class="space-y-4"></div>
                </div>

                <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                    <div class="mb-4 flex items-center justify-between">
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Archived reports</h2>
                        <span id="archived-count" class="text-sm text-slate-500 dark:text-slate-400">0</span>
                    </div>
                    <div id="admin-archived-list" class="space-y-3"></div>
                </div>
            </div>

            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">User accounts</h2>
                <div id="admin-users-list" class="mt-4 space-y-3"></div>
            </div>
        </section>
    </main>
</body>
</html>
